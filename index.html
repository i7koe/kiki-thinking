<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>kk^小記</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="wrapper">
      <a class="site-title" href="index.html">kk^小記</a>
      <nav class="site-nav">
        <a href="catalog.html">目录</a>
        <a href="about.html">关于</a>
      </nav>
    </div>
  </header>

  <main class="page-content">
    <div class="wrapper">
      <div class="layout">

        <div class="main-col">
          <div class="home-welcome">
            <h1 class="home-title">好想告訴你</h1>
            <p class="home-sub">记一些不值得记住的事</p>
            <a class="home-enter" href="catalog.html">进入目录 →</a>
          </div>
        </div>

        <aside class="sidebar-col">
          <div class="sidebar-section">
            <h3 class="sidebar-title">关于</h3>
            <div class="sidebar-about">
              <span class="site-name">kk^小記</span>
              <span class="site-desc">好想告訴你</span>
            </div>
          </div>

          <div class="sidebar-section music-section">
            <h3 class="sidebar-title">此刻在听</h3>
            <div class="music-player">
              <iframe
                frameborder="no"
                border="0"
                marginwidth="0"
                marginheight="0"
                width="280"
                height="86"
                src="//music.163.com/outchain/player?type=2&id=2001036566&auto=1&height=66"
                allow="autoplay; encrypted-media">
              </iframe>
            </div>
          </div>
        </aside>

      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrapper">
      <p>&copy; 2025 [咳咳咳] &middot; 由 [kk] 驱动</p>
    </div>
  </footer>

  <div class="back-to-top" onclick="window.scrollTo({top:0,behavior:'smooth'})" title="回到顶部">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 15l-6-6-6 6"/>
    </svg>
  </div>

  <script>
    (function() {
      var btn = document.querySelector('.back-to-top');
      window.addEventListener('scroll', function() {
        if (window.scrollY > 300) {
          btn.classList.add('visible');
        } else {
          btn.classList.remove('visible');
        }
      }, { passive: true });
    })();
  </script>

</body>
</html>
